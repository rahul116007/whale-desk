name: Whale Desk refresh

on:
  schedule:
    - cron: "17 * * * *"          # hourly slot; GitHub drops many scheduled runs on free repos, this still yields ~8-12 refreshes a day
  workflow_dispatch:
    inputs:
      research:
        description: "Coin to deep-dive (optional, e.g. PEPE)"
        required: false
        default: ""
      review:
        description: "Run the weekly self-review + backtest now (true/false)"
        required: false
        default: "false"

permissions:
  contents: write

concurrency:
  group: whale-desk
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
      X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
      ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Whale scan (new DEX buys / sells / transfers)
        run: python -u whale_scanner.py scan

      - name: Holdings snapshot (once a day, 06:xx UTC run, or when missing)
        run: |
          H=$(date -u +%H)
          if [ "$H" = "06" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ ! -f holdings.csv ]; then python -u whale_scanner.py holdings; else echo "skipped (runs at 06:xx UTC)"; fi

      - name: Coin desk refresh (market, news, smart money, recommendations, dashboard)
        run: python -u coin_desk.py refresh

      - name: Weekly self-review + backtest (Mondays 06:xx UTC, or manual with review=true)
        run: |
          if [ "$(date -u +%u%H)" = "106" ] || [ "${{ github.event.inputs.review }}" = "true" ]; then python -u review.py --apply && python -u backtest.py --apply; else echo "skipped (Mondays 06:xx UTC)"; fi

      - name: Research a coin (manual runs only)
        if: ${{ github.event.inputs.research != '' }}
        run: python -u coin_desk.py research "${{ github.event.inputs.research }}"

      - name: Commit results
        run: |
          git config user.name "whale-desk-bot"
          git config user.email "whale-desk-bot@users.noreply.github.com"
          git add -A
          git commit -m "refresh $(date -u +'%Y-%m-%d %H:%M')Z" || echo "nothing to commit"
          git pull --rebase --autostash || true
          git push
